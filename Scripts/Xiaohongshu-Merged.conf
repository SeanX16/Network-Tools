#############################################


host, ads-img-qc.xhscdn.com, reject
host, ads-img-al.xhscdn.com, reject
host, ads-video-al.xhscdn.com, reject
host, ads-video-qc.xhscdn.com, reject
host, t-ads.xiaohongshu.com, reject

# 惊喜弹窗
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/surprisebox\/(get_style|open|submit_action) url reject-dict
^https?:\/\/www\.(xiaohongshu|rnote)\.com\/api\/marketing\/box\/trigger\? url reject-dict
# 信息流
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/note\/guide\? url reject-dict
# v1 预加载：同步静态图原尺寸地址；兼容带查询参数和不带参数的请求，保留视频内容
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v1\/note\/detailfeed\/preload(?:\?|$) url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
# 未支持版本保持原拦截范围
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v(?!1\/)\d+\/note\/detailfeed\/preload\? url reject-dict
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/guide\/user_banner url reject-dict
^https?:\/\/www\.(xiaohongshu|rnote)\.com\/api\/sns\/(v\d+\/ads\/resource|v\d+\/hey\/\w+\/hey_gallery) url reject-dict
# 搜索页
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/search\/(banner_list|hot_list) url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/search\/(hint|trending)\? url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
^https?:\/\/(so|edith)\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/search\/notes\? url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
# 开屏广告
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/system_service\/config\? url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/system_service\/splash_config url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
# 详情页,小部件
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/note\/widgets url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
#^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/user\/followings\/followfeed url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
#^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/recommend\/user\/follow_recommend\? url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
# 图片水印,视频水印
^https?:\/\/(edith|rec|www)\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/note\/(imagefeed|live_photo\/save) url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
^https?:\/\/(edith|rec|www)\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/(followfeed|homefeed)\? url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
^https?:\/\/(edith|rec|www)\.(xiaohongshu|rnote)\.com\/api\/sns\/(v2\/note\/feed|v3\/note\/videofeed)\? url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
^https?:\/\/(edith|rec|www)\.(xiaohongshu|rnote)\.com\/api\/sns\/(v4\/note\/videofeed|v10\/note\/video\/save)(?:\?|$) url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
# 评论列表/子评论：保留用户 id 处理，并缓存实况和视频的无水印候选
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/(?:v5\/note\/comment\/list|v3\/note\/comment\/sub_comments)(?:\?|$) url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
# 评论实况/视频下载：按笔记与 video_id 匹配，找不到时保留服务器地址
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v1\/interaction\/comment\/video\/download(?:\?|$) url script-response-body https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js
# 其他版本的评论列表沿用原文本替换；避免与 v5 脚本规则重叠
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v(?!5\/)\d\/note\/comment\/list url response-body red_id response-body fmz200
# 评论区图片水印 (实验功能可能无效)
^https?:\/\/ci\.(xiaohongshu|rnote)\.com\/system_config\/watermark url reject-img

# 仅在脚本内满足保存 UA、无 Range、缓存路径和长度一致时返回原视频跳转
^https?:\/\/(?:sns-video-[a-z0-9-]+\.xhscdn\.com|sns-v[0-9]+\.(?:xhscdn|rednotecdn)\.com)\/stream\/[0-9]+\/[0-9]+\/[0-9]+\/[A-Za-z0-9_-]+\.mp4(?:\?|$) url script-response-header https://raw.githubusercontent.com/SeanX16/Network-Tools/main/Scripts/xhs-merged.js

hostname = sns-video-*.xhscdn.com, sns-v*.xhscdn.com, sns-v*.rednotecdn.com, so.xiaohongshu.com, edith.xiaohongshu.com, www.xiaohongshu.com, ci.xiaohongshu.com, rec.xiaohongshu.com, edith.rnote.com, www.rnote.com, ci.rnote.com, so.rnote.com, rec.rnote.com

#!name=小红书整合版 v8.3（原生播放与原视频保存）
#!desc=播放交给 APP 原生选流；保存独立匹配全部候选，优先最高 4K 原文件并保留兼容流兜底。保留保存特征匹配及格式检查，与其他小红书重写互斥。
#!author=奶思 / fmz200；高清保存修复与整合：SeanX16
